name: Router corpus nightly

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

concurrency:
  group: router-corpus-nightly
  cancel-in-progress: true

jobs:
  corpus:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Resolve the fab_router pin
        id: fab-router
        run: echo "commit=$(tr -d '[:space:]' < packages/router/FAB_ROUTER_COMMIT)" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned fab_router
        uses: actions/checkout@v4
        with:
          repository: fabPlane/fab_router
          ref: ${{ steps.fab-router.outputs.commit }}
          path: .ci-private/fab_router
          persist-credentials: false
          sparse-checkout: |
            package.json
            src
            spec/types
          sparse-checkout-cone-mode: false
      - name: Run the nightly corpus
        env:
          FAB_ROUTER_MODULE: ${{ github.workspace }}/.ci-private/fab_router/src/api.ts
        run: bun run --filter @fp-pcb/router corpus --nightly --output artifacts/router-corpus.json
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: router-corpus-${{ github.run_id }}
          path: artifacts/router-corpus.json
          retention-days: 30
