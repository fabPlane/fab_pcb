name: Backend release

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Linux runner selection (auto uses the NAS)
        type: choice
        options: [auto, local, blacksmith, github]
        default: auto
      rebuild_image:
        description: Rebuild the pinned Linux KiCad image even when its immutable tag exists
        type: boolean
        default: false
      publish_release:
        description: Publish the FabRouter-enabled archives as backend-<commit>
        type: boolean
        default: true
  push:
    branches: [main, feature/fabdesk-handoff-followups]
    paths:
      - packages/proto/KICAD_COMMIT
      - packages/kicad-patches/**
      - packages/bridge/**
      - packages/client/**
      - packages/compile/**
      - packages/router/**
      - .github/workflows/backend-release.yml

concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  BUN_VERSION: "1.4.0"
  KICAD_IMAGE: ghcr.io/${{ github.repository_owner }}/kicad-cli
  KICAD_REPO: https://github.com/${{ github.repository_owner }}/kicad.git

jobs:
  select-linux-runner:
    runs-on: [self-hosted, Linux, X64, tf-nas-ephemeral, fab-pcb]
    outputs:
      runner: ${{ steps.select.outputs.runner }}
      choice: ${{ steps.select.outputs.choice }}
    steps:
      - name: Select Linux runner
        id: select
        shell: bash
        env:
          RUNNER_MODE: ${{ inputs.runner || 'auto' }}
        run: |
          set -euo pipefail

          select_runner() {
            case "$1" in
              local)
                runner='["self-hosted","Linux","X64","tf-nas-ephemeral","fab-pcb"]'
                ;;
              blacksmith)
                runner='"blacksmith-4vcpu-ubuntu-2404"'
                ;;
              github)
                runner='"ubuntu-24.04"'
                ;;
              *)
                echo "unknown runner mode: $1" >&2
                exit 1
                ;;
            esac
            echo "runner=$runner" >> "$GITHUB_OUTPUT"
            echo "choice=$1" >> "$GITHUB_OUTPUT"
            echo "Selected Linux runner: $1"
            echo "Linux runner: $1" >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$RUNNER_MODE" != auto ]; then
            select_runner "$RUNNER_MODE"
            exit 0
          fi

          select_runner local

  linux-x64:
    needs: select-linux-runner
    runs-on: ${{ fromJSON(needs.select-linux-runner.outputs.runner) }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Resolve the fab_router pin
        id: linux-fab-router
        run: echo "commit=$(tr -d '[:space:]' < packages/router/FAB_ROUTER_COMMIT)" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned fab_router
        uses: actions/checkout@v4
        with:
          repository: fabPlane/fab_router
          ref: ${{ steps.linux-fab-router.outputs.commit }}
          path: .release-private/fab_router
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Resolve immutable versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          kicad="$(tr -d '[:space:]' < packages/proto/KICAD_COMMIT)"
          image="$(printf '%s' "$KICAD_IMAGE" | tr '[:upper:]' '[:lower:]'):$kicad"
          image_short="$(printf '%s' "$KICAD_IMAGE" | tr '[:upper:]' '[:lower:]'):${kicad:0:10}"
          {
            echo "kicad=$kicad"
            echo "image=$image"
            echo "image_short=$image_short"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for the pinned image
        id: image
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ inputs.rebuild_image }}" = "true" ]; then exit 1; fi
          docker pull "${{ steps.versions.outputs.image }}"
      - name: Build and publish the pinned KiCad image
        if: steps.image.outcome != 'success'
        uses: docker/build-push-action@v6
        with:
          context: packages/kicad-patches/docker
          file: packages/kicad-patches/docker/Dockerfile
          build-args: |
            KICAD_SOURCE=git
            KICAD_REPO=${{ env.KICAD_REPO }}
            KICAD_REF=${{ steps.versions.outputs.kicad }}
            JOBS=3
            BASE=ubuntu:24.04
          tags: |
            ${{ steps.versions.outputs.image }}
            ${{ steps.versions.outputs.image_short }}
          # The immutable GHCR tag is the cache: successful builds are pulled above and skipped.
          # Exporting the large native build cache doubles peak disk use on GitHub-hosted runners.
          push: true
      - name: Free local BuildKit cache before pulling the published image
        if: steps.image.outcome != 'success'
        run: docker buildx prune --all --force
      - name: Pull the newly published image
        if: steps.image.outcome != 'success'
        run: docker pull "${{ steps.versions.outputs.image }}"
      - name: Check out pinned KiCad source and libraries
        shell: bash
        run: |
          set -euo pipefail
          kicad="$(tr -d '[:space:]' < packages/proto/KICAD_COMMIT)"
          git init -q "$RUNNER_TEMP/kicad-source"
          git -C "$RUNNER_TEMP/kicad-source" remote add origin "$KICAD_REPO"
          git -C "$RUNNER_TEMP/kicad-source" fetch --depth 1 origin "$kicad"
          git -C "$RUNNER_TEMP/kicad-source" checkout -q FETCH_HEAD
          for name in footprints symbols; do
            case "$name" in
              footprints) repo=https://gitlab.com/kicad/libraries/kicad-footprints.git; pin=packages/kicad-patches/KICAD_FOOTPRINTS_COMMIT ;;
              symbols) repo=https://gitlab.com/kicad/libraries/kicad-symbols.git; pin=packages/kicad-patches/KICAD_SYMBOLS_COMMIT ;;
            esac
            commit="$(tr -d '[:space:]' < "$pin")"
            git init -q "$RUNNER_TEMP/kicad-$name"
            git -C "$RUNNER_TEMP/kicad-$name" remote add origin "$repo"
            git -C "$RUNNER_TEMP/kicad-$name" fetch --depth 1 origin "$commit"
            git -C "$RUNNER_TEMP/kicad-$name" checkout -q FETCH_HEAD
          done
      - name: Assemble dependency-complete Linux backend
        shell: bash
        env:
          FP_PCB_FAB_ROUTER_SOURCE: ${{ github.workspace }}/.release-private/fab_router
        run: |
          set -euo pipefail
          container="$(docker create '${{ steps.versions.outputs.image }}')"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$RUNNER_TEMP/runtime" dist/pcb
          docker cp "$container:/opt/kicad/." "$RUNNER_TEMP/runtime/"
          bun packages/kicad-patches/bundle.ts linux-x64 \
            "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/kicad-footprints" "$RUNNER_TEMP/kicad-symbols" dist/pcb/linux-x64
      - name: Native bundle smoke
        run: bun packages/kicad-patches/smoke-bundle.ts dist/pcb/linux-x64/bundle.json linux-x64
      - name: Native KiCad process-signal integration
        env:
          KICAD_CLI: ${{ github.workspace }}/dist/pcb/linux-x64/kicad/bin/kicad-cli
          KICAD_SRC: ${{ runner.temp }}/kicad-source
          KICAD_INTEGRATION_REQUIRED: "1"
          LD_LIBRARY_PATH: ${{ github.workspace }}/dist/pcb/linux-x64/kicad/lib:${{ github.workspace }}/dist/pcb/linux-x64/kicad/lib/runtime
        run: |
          bun test packages/bridge/test/bridge.kicad.test.ts
          bun test packages/client/test/nng-ipc.kicad.test.ts \
            --test-name-pattern "server killed mid-request"
      - name: Archive backend
        run: tar -C dist/pcb/linux-x64 -czf fp-pcb-backend-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: fp-pcb-backend-linux-x64
          path: fp-pcb-backend-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: [self-hosted, macOS, ARM64, macos-arm64, ios-builds, mac-mini], target: darwin-arm64 }
          - { os: [self-hosted, macOS, ARM64, macos-arm64, ios-builds, mac-mini], target: darwin-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Resolve the fab_router pin
        id: macos-fab-router
        run: echo "commit=$(tr -d '[:space:]' < packages/router/FAB_ROUTER_COMMIT)" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned fab_router
        uses: actions/checkout@v4
        with:
          repository: fabPlane/fab_router
          ref: ${{ steps.macos-fab-router.outputs.commit }}
          path: .release-private/fab_router
          persist-credentials: false
      - name: Install native build dependencies
        run: brew install cmake ninja ccache wxwidgets@3.2 boost protobuf nng glew glm cairo pixman harfbuzz freetype fontconfig gettext opencascade libngspice unixodbc libgit2 zstd
      - name: Check out pinned KiCad source and libraries
        shell: bash
        run: |
          set -euo pipefail
          kicad="$(tr -d '[:space:]' < packages/proto/KICAD_COMMIT)"
          git init -q "$RUNNER_TEMP/kicad"
          git -C "$RUNNER_TEMP/kicad" remote add origin "$KICAD_REPO"
          git -C "$RUNNER_TEMP/kicad" fetch --depth 1 origin "$kicad"
          git -C "$RUNNER_TEMP/kicad" checkout -q FETCH_HEAD
          for name in footprints symbols; do
            case "$name" in
              footprints) repo=https://gitlab.com/kicad/libraries/kicad-footprints.git; pin=packages/kicad-patches/KICAD_FOOTPRINTS_COMMIT ;;
              symbols) repo=https://gitlab.com/kicad/libraries/kicad-symbols.git; pin=packages/kicad-patches/KICAD_SYMBOLS_COMMIT ;;
            esac
            commit="$(tr -d '[:space:]' < "$pin")"
            git init -q "$RUNNER_TEMP/kicad-$name"
            git -C "$RUNNER_TEMP/kicad-$name" remote add origin "$repo"
            git -C "$RUNNER_TEMP/kicad-$name" fetch --depth 1 origin "$commit"
            git -C "$RUNNER_TEMP/kicad-$name" checkout -q FETCH_HEAD
          done
      - name: Cache native objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: kicad-${{ matrix.target }}-${{ hashFiles('packages/proto/KICAD_COMMIT') }}
          restore-keys: kicad-${{ matrix.target }}-
      - name: Build patched KiCad
        env:
          CCACHE_DIR: ~/.cache/ccache
        run: packages/kicad-patches/build-macos.sh "$RUNNER_TEMP/kicad" Release
      - name: Stage relocatable runtime and assemble backend
        shell: bash
        env:
          FP_PCB_FAB_ROUTER_SOURCE: ${{ github.workspace }}/.release-private/fab_router
        run: |
          set -euo pipefail
          bun packages/kicad-patches/stage-macos.ts \
            "$RUNNER_TEMP/kicad/build/release/kicad/KiCad.app" "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/kicad"
          bun packages/kicad-patches/bundle.ts "${{ matrix.target }}" \
            "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/kicad-footprints" "$RUNNER_TEMP/kicad-symbols" "dist/pcb/${{ matrix.target }}"
      - name: Native bundle smoke
        run: bun packages/kicad-patches/smoke-bundle.ts "dist/pcb/${{ matrix.target }}/bundle.json" "${{ matrix.target }}"
      - name: Reject non-relocatable dependencies
        shell: bash
        run: |
          set -euo pipefail
          if find "dist/pcb/${{ matrix.target }}/kicad" -type f -perm -111 -print0 | xargs -0 otool -L 2>/dev/null \
            | grep -E '/(opt/homebrew|usr/local|Users/runner|private/tmp)/'; then
            echo '::error::backend still references a build-machine dependency'
            exit 1
          fi
      - name: Archive backend
        run: tar -C "dist/pcb/${{ matrix.target }}" -czf "fp-pcb-backend-${{ matrix.target }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: fp-pcb-backend-${{ matrix.target }}
          path: fp-pcb-backend-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  windows-x64:
    runs-on: [self-hosted, Windows, X64, tf-nas-ephemeral, fab-pcb, tf-nas-windows]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Resolve the fab_router pin
        id: windows-fab-router
        shell: pwsh
        run: '"commit=$((Get-Content packages/router/FAB_ROUTER_COMMIT -Raw).Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8'
      - name: Check out the pinned fab_router
        uses: actions/checkout@v4
        with:
          repository: fabPlane/fab_router
          ref: ${{ steps.windows-fab-router.outputs.commit }}
          path: .release-private/fab_router
          persist-credentials: false
      - name: Check out pinned KiCad source and libraries
        shell: pwsh
        run: |
          $kicad = (Get-Content packages/proto/KICAD_COMMIT -Raw).Trim()
          git init -q "$env:RUNNER_TEMP/kicad"
          git -C "$env:RUNNER_TEMP/kicad" remote add origin $env:KICAD_REPO
          git -C "$env:RUNNER_TEMP/kicad" fetch --depth 1 origin $kicad
          git -C "$env:RUNNER_TEMP/kicad" checkout -q FETCH_HEAD
          $libraries = @(
            @{ Name = "footprints"; Repo = "https://gitlab.com/kicad/libraries/kicad-footprints.git"; Pin = "packages/kicad-patches/KICAD_FOOTPRINTS_COMMIT" },
            @{ Name = "symbols"; Repo = "https://gitlab.com/kicad/libraries/kicad-symbols.git"; Pin = "packages/kicad-patches/KICAD_SYMBOLS_COMMIT" }
          )
          foreach ($library in $libraries) {
            $commit = (Get-Content $library.Pin -Raw).Trim()
            $path = "$env:RUNNER_TEMP/kicad-$($library.Name)"
            git init -q $path
            git -C $path remote add origin $library.Repo
            git -C $path fetch --depth 1 origin $commit
            git -C $path checkout -q FETCH_HEAD
          }
      - name: Set up the KiCad-pinned vcpkg
        shell: pwsh
        run: |
          $config = Get-Content "$env:RUNNER_TEMP/kicad/vcpkg-configuration.json" | ConvertFrom-Json
          $baseline = $config."default-registry".baseline
          $root = "$env:RUNNER_TEMP/vcpkg"
          git clone --quiet --filter=tree:0 https://github.com/microsoft/vcpkg $root
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C $root checkout --quiet $baseline
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $triplets = "$env:RUNNER_TEMP/kicad-release-triplets"
          New-Item -ItemType Directory -Force $triplets | Out-Null
          $baseTriplet = "$env:RUNNER_TEMP/kicad/tools/custom_vcpkg_triplets/x64-windows.cmake" -replace '\\', '/'
          @"
          include("$baseTriplet")
          set(VCPKG_BUILD_TYPE release)
          "@ | Set-Content "$triplets/x64-windows.cmake"
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "KICAD_WINDOWS_TRIPLETS=$triplets" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_BINARY_SOURCES=clear;files,$env:RUNNER_TEMP/vcpkg-cache,readwrite" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore vcpkg binary packages
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-windows-x64-release-v1-${{ hashFiles('packages/proto/KICAD_COMMIT') }}
          restore-keys: vcpkg-windows-x64-release-v1-

      # A cold Windows dependency build can exceed one run. Save its completed ports before
      # failing so a rerun resumes instead of restarting OpenCascade, wxWidgets, Boost, and ICU.
      - name: Install vcpkg dependencies
        id: vcpkg-install
        timeout-minutes: 250
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/vcpkg-cache" | Out-Null
          & "$env:VCPKG_ROOT/vcpkg.exe" install `
            --triplet=x64-windows `
            "--x-manifest-root=$env:RUNNER_TEMP/kicad" `
            "--x-install-root=$env:RUNNER_TEMP/kicad/build/release/vcpkg_installed" `
            "--overlay-triplets=$env:KICAD_WINDOWS_TRIPLETS" `
            --x-abi-tools-use-exact-versions `
            --clean-after-build
          exit $LASTEXITCODE

      - name: Save complete vcpkg cache
        if: steps.vcpkg-install.outcome == 'success' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Save partial vcpkg cache
        if: always() && steps.vcpkg-install.outcome != 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}-partial-${{ github.run_id }}

      - name: Require complete vcpkg dependencies
        if: steps.vcpkg-install.outcome != 'success'
        shell: bash
        run: |
          echo "::error::vcpkg did not finish inside its time budget. Partial packages were cached; rerun this workflow to continue."
          exit 1

      - name: Build patched KiCad and assemble backend
        shell: pwsh
        env:
          FP_PCB_FAB_ROUTER_SOURCE: ${{ github.workspace }}/.release-private/fab_router
        run: |
          packages/kicad-patches/build-windows.ps1 `
            -KicadSource "$env:RUNNER_TEMP/kicad" `
            -VcpkgRoot $env:VCPKG_ROOT `
            -VcpkgOverlayTriplets $env:KICAD_WINDOWS_TRIPLETS `
            -Footprints "$env:RUNNER_TEMP/kicad-footprints" `
            -Symbols "$env:RUNNER_TEMP/kicad-symbols" `
            -Output "dist/pcb/windows-x64"
      - name: Native bundle smoke
        run: bun packages/kicad-patches/smoke-bundle.ts dist/pcb/windows-x64/bundle.json windows-x64
      - name: Archive backend
        shell: pwsh
        run: tar -C dist/pcb/windows-x64 -czf fp-pcb-backend-windows-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: fp-pcb-backend-windows-x64
          path: fp-pcb-backend-windows-x64.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [select-linux-runner, linux-x64, macos, windows-x64]
    if: github.event_name == 'push' || inputs.publish_release == true
    runs-on: ${{ fromJSON(needs.select-linux-runner.outputs.runner) }}
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fp-pcb-backend-*
          path: artifacts
          merge-multiple: true
      - name: Resolve immutable release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test "$(find artifacts -name 'fp-pcb-backend-*.tar.gz' | wc -l | tr -d ' ')" = 4
          echo "tag=backend-${GITHUB_SHA:0:10}" >> "$GITHUB_OUTPUT"
      - name: Publish immutable FabRouter-enabled backend release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body: FabRouter-enabled FabPlane PCB native backends for ${{ github.sha }}.
          files: artifacts/fp-pcb-backend-*.tar.gz
          fail_on_unmatched_files: true
