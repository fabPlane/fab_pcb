name: Backend release

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Linux runner selection (auto uses the NAS)
        type: choice
        options: [auto, local, blacksmith, github]
        default: auto
      publish_release:
        description: Publish the FabRouter-enabled archives as backend-<commit>
        type: boolean
        default: true
  push:
    branches: [main, feature/fabdesk-handoff-followups]
    paths:
      - packages/proto/KICAD_COMMIT
      - packages/kicad-patches/**
      - packages/bridge/**
      - packages/client/**
      - packages/compile/**
      - packages/router/**
      - .github/workflows/backend-release.yml

concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  BUN_VERSION: "1.4.0"
  KICAD_RELEASE_REPO: fabPlane/kicad

jobs:
  select-linux-runner:
    runs-on: [self-hosted, Linux, X64, tf-nas-ephemeral, fab-pcb]
    outputs:
      runner: ${{ steps.select.outputs.runner }}
      choice: ${{ steps.select.outputs.choice }}
      kicad_tag: ${{ steps.kicad.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the prebuilt KiCad runtime
        id: kicad
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          commit="$(tr -d '[:space:]' < packages/proto/KICAD_COMMIT)"
          sha10="${commit:0:10}"
          releases="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$KICAD_RELEASE_REPO/releases?per_page=100")"
          tag="$(printf '%s' "$releases" | jq -r --arg suffix "-$sha10" \
            '.[] | .tag_name | select(startswith("nightly-") and endswith($suffix))' | head -1)"
          if [ -z "$tag" ]; then
            echo "::error title=no prebuilt KiCad runtime::No $KICAD_RELEASE_REPO nightly release matches KICAD_COMMIT $commit"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "KiCad runtime: $KICAD_RELEASE_REPO@$tag" >> "$GITHUB_STEP_SUMMARY"
      - name: Select Linux runner
        id: select
        shell: bash
        env:
          RUNNER_MODE: ${{ inputs.runner || 'auto' }}
        run: |
          set -euo pipefail

          select_runner() {
            case "$1" in
              local)
                runner='["self-hosted","Linux","X64","tf-nas-ephemeral","fab-pcb"]'
                ;;
              blacksmith)
                runner='"blacksmith-4vcpu-ubuntu-2404"'
                ;;
              github)
                runner='"ubuntu-24.04"'
                ;;
              *)
                echo "unknown runner mode: $1" >&2
                exit 1
                ;;
            esac
            echo "runner=$runner" >> "$GITHUB_OUTPUT"
            echo "choice=$1" >> "$GITHUB_OUTPUT"
            echo "Selected Linux runner: $1"
            echo "Linux runner: $1" >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "$RUNNER_MODE" != auto ]; then
            select_runner "$RUNNER_MODE"
            exit 0
          fi

          select_runner local

  linux-x64:
    needs: select-linux-runner
    runs-on: ${{ fromJSON(needs.select-linux-runner.outputs.runner) }}
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install runner prerequisites
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git jq unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Resolve the fab_router pin
        id: linux-fab-router
        run: echo "commit=$(tr -d '[:space:]' < packages/router/FAB_ROUTER_COMMIT)" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned fab_router
        uses: actions/checkout@v4
        with:
          repository: fabPlane/fab_router
          ref: ${{ steps.linux-fab-router.outputs.commit }}
          path: .release-private/fab_router
          persist-credentials: false
      - name: Download the pinned KiCad runtime
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cli="$(bun tooling/kicad-cli/fetch.ts \
            --repo "$KICAD_RELEASE_REPO" \
            --tag '${{ needs.select-linux-runner.outputs.kicad_tag }}' \
            --platform linux-x86_64 \
            --dir "$RUNNER_TEMP/kicad-nightly")"
          echo "KICAD_RUNTIME=$(dirname "$cli")" >> "$GITHUB_ENV"
      - name: Check out pinned KiCad libraries
        shell: bash
        run: |
          set -euo pipefail
          kicad="$(tr -d '[:space:]' < packages/proto/KICAD_COMMIT)"
          git init -q "$RUNNER_TEMP/kicad-source"
          git -C "$RUNNER_TEMP/kicad-source" remote add origin "https://github.com/fabPlane/kicad.git"
          git -C "$RUNNER_TEMP/kicad-source" sparse-checkout set --no-cone qa/data tools/nightly/linux
          git -C "$RUNNER_TEMP/kicad-source" fetch --depth 1 --filter=blob:none origin "$kicad"
          git -C "$RUNNER_TEMP/kicad-source" checkout -q FETCH_HEAD
          for name in footprints symbols; do
            case "$name" in
              footprints) repo=https://gitlab.com/kicad/libraries/kicad-footprints.git; pin=packages/kicad-patches/KICAD_FOOTPRINTS_COMMIT ;;
              symbols) repo=https://gitlab.com/kicad/libraries/kicad-symbols.git; pin=packages/kicad-patches/KICAD_SYMBOLS_COMMIT ;;
            esac
            commit="$(tr -d '[:space:]' < "$pin")"
            git init -q "$RUNNER_TEMP/kicad-$name"
            git -C "$RUNNER_TEMP/kicad-$name" remote add origin "$repo"
            git -C "$RUNNER_TEMP/kicad-$name" fetch --depth 1 origin "$commit"
            git -C "$RUNNER_TEMP/kicad-$name" checkout -q FETCH_HEAD
          done
      - name: Install runtime libraries required by the KiCad archive
        shell: bash
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/kicad-source/tools/nightly/linux/runtime-packages.txt"
          test -s "$list"
          apt-get update -qq
          # shellcheck disable=SC2046
          apt-get install -y -qq --no-install-recommends $(grep -v '^#' "$list" | tr '\n' ' ')
      - name: Assemble dependency-complete Linux backend
        shell: bash
        env:
          FP_PCB_FAB_ROUTER_SOURCE: ${{ github.workspace }}/.release-private/fab_router
        run: |
          set -euo pipefail
          bun packages/kicad-patches/bundle.ts linux-x64 \
            "$KICAD_RUNTIME" "$RUNNER_TEMP/kicad-footprints" "$RUNNER_TEMP/kicad-symbols" dist/pcb/linux-x64
      - name: Native bundle smoke
        run: bun packages/kicad-patches/smoke-bundle.ts dist/pcb/linux-x64/bundle.json linux-x64
      - name: Native KiCad process-signal integration
        env:
          KICAD_CLI: ${{ github.workspace }}/dist/pcb/linux-x64/kicad/bin/kicad-cli
          KICAD_SRC: ${{ runner.temp }}/kicad-source
          KICAD_INTEGRATION_REQUIRED: "1"
          LD_LIBRARY_PATH: ${{ github.workspace }}/dist/pcb/linux-x64/kicad/lib:${{ github.workspace }}/dist/pcb/linux-x64/kicad/lib/runtime
        run: |
          bun test packages/bridge/test/bridge.kicad.test.ts
          bun test packages/client/test/nng-ipc.kicad.test.ts \
            --test-name-pattern "server killed mid-request"
      - name: Archive backend
        run: tar -C dist/pcb/linux-x64 -czf fp-pcb-backend-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: fp-pcb-backend-linux-x64
          path: fp-pcb-backend-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 1

  macos:
    needs: select-linux-runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: [self-hosted, macOS, ARM64, macos-arm64, ios-builds, mac-mini], target: darwin-arm64, kicad-platform: macos-arm64 }
          - { os: [self-hosted, macOS, ARM64, macos-arm64, ios-builds, mac-mini], target: darwin-x64, kicad-platform: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Resolve the fab_router pin
        id: macos-fab-router
        run: echo "commit=$(tr -d '[:space:]' < packages/router/FAB_ROUTER_COMMIT)" >> "$GITHUB_OUTPUT"
      - name: Check out the pinned fab_router
        uses: actions/checkout@v4
        with:
          repository: fabPlane/fab_router
          ref: ${{ steps.macos-fab-router.outputs.commit }}
          path: .release-private/fab_router
          persist-credentials: false
      - name: Download the pinned KiCad runtime
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cli="$(bun tooling/kicad-cli/fetch.ts \
            --repo "$KICAD_RELEASE_REPO" \
            --tag '${{ needs.select-linux-runner.outputs.kicad_tag }}' \
            --platform '${{ matrix.kicad-platform }}' \
            --dir "$RUNNER_TEMP/kicad-nightly")"
          echo "KICAD_RUNTIME=$(dirname "$cli")" >> "$GITHUB_ENV"
      - name: Check out pinned KiCad libraries
        shell: bash
        run: |
          set -euo pipefail
          for name in footprints symbols; do
            case "$name" in
              footprints) repo=https://gitlab.com/kicad/libraries/kicad-footprints.git; pin=packages/kicad-patches/KICAD_FOOTPRINTS_COMMIT ;;
              symbols) repo=https://gitlab.com/kicad/libraries/kicad-symbols.git; pin=packages/kicad-patches/KICAD_SYMBOLS_COMMIT ;;
            esac
            commit="$(tr -d '[:space:]' < "$pin")"
            git init -q "$RUNNER_TEMP/kicad-$name"
            git -C "$RUNNER_TEMP/kicad-$name" remote add origin "$repo"
            git -C "$RUNNER_TEMP/kicad-$name" fetch --depth 1 origin "$commit"
            git -C "$RUNNER_TEMP/kicad-$name" checkout -q FETCH_HEAD
          done
      - name: Assemble backend from the prebuilt runtime
        shell: bash
        env:
          FP_PCB_FAB_ROUTER_SOURCE: ${{ github.workspace }}/.release-private/fab_router
        run: |
          set -euo pipefail
          bun packages/kicad-patches/bundle.ts "${{ matrix.target }}" \
            "$KICAD_RUNTIME" "$RUNNER_TEMP/kicad-footprints" "$RUNNER_TEMP/kicad-symbols" "dist/pcb/${{ matrix.target }}"
      - name: Native bundle smoke
        run: bun packages/kicad-patches/smoke-bundle.ts "dist/pcb/${{ matrix.target }}/bundle.json" "${{ matrix.target }}"
      - name: Reject non-relocatable dependencies
        shell: bash
        run: |
          set -euo pipefail
          if find "dist/pcb/${{ matrix.target }}/kicad" -type f -perm -111 -print0 | xargs -0 otool -L 2>/dev/null \
            | grep -E '/(opt/homebrew|usr/local|Users/runner|private/tmp)/'; then
            echo '::error::backend still references a build-machine dependency'
            exit 1
          fi
      - name: Archive backend
        run: tar -C "dist/pcb/${{ matrix.target }}" -czf "fp-pcb-backend-${{ matrix.target }}.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: fp-pcb-backend-${{ matrix.target }}
          path: fp-pcb-backend-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  windows-x64:
    needs: select-linux-runner
    runs-on: [self-hosted, Windows, X64, tf-nas-ephemeral, fab-pcb, tf-nas-windows]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Resolve the fab_router pin
        id: windows-fab-router
        shell: pwsh
        run: '"commit=$((Get-Content packages/router/FAB_ROUTER_COMMIT -Raw).Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8'
      - name: Check out the pinned fab_router
        uses: actions/checkout@v4
        with:
          repository: fabPlane/fab_router
          ref: ${{ steps.windows-fab-router.outputs.commit }}
          path: .release-private/fab_router
          persist-credentials: false
      - name: Download the pinned KiCad runtime
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $cli = (& bun tooling/kicad-cli/fetch.ts `
            --repo $env:KICAD_RELEASE_REPO `
            --tag '${{ needs.select-linux-runner.outputs.kicad_tag }}' `
            --platform windows-x86_64 `
            --dir "$env:RUNNER_TEMP/kicad-nightly" | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $runtime = Split-Path (Split-Path $cli -Parent) -Parent
          "KICAD_RUNTIME=$runtime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check out pinned KiCad libraries
        shell: pwsh
        run: |
          $libraries = @(
            @{ Name = "footprints"; Repo = "https://gitlab.com/kicad/libraries/kicad-footprints.git"; Pin = "packages/kicad-patches/KICAD_FOOTPRINTS_COMMIT" },
            @{ Name = "symbols"; Repo = "https://gitlab.com/kicad/libraries/kicad-symbols.git"; Pin = "packages/kicad-patches/KICAD_SYMBOLS_COMMIT" }
          )
          foreach ($library in $libraries) {
            $commit = (Get-Content $library.Pin -Raw).Trim()
            $path = "$env:RUNNER_TEMP/kicad-$($library.Name)"
            git init -q $path
            git -C $path remote add origin $library.Repo
            git -C $path fetch --depth 1 origin $commit
            git -C $path checkout -q FETCH_HEAD
          }
      - name: Assemble backend from the prebuilt runtime
        shell: pwsh
        env:
          FP_PCB_FAB_ROUTER_SOURCE: ${{ github.workspace }}/.release-private/fab_router
        run: |
          bun packages/kicad-patches/bundle.ts windows-x64 `
            $env:KICAD_RUNTIME `
            "$env:RUNNER_TEMP/kicad-footprints" `
            "$env:RUNNER_TEMP/kicad-symbols" `
            "dist/pcb/windows-x64"
      - name: Native bundle smoke
        run: bun packages/kicad-patches/smoke-bundle.ts dist/pcb/windows-x64/bundle.json windows-x64
      - name: Archive backend
        shell: pwsh
        run: tar -C dist/pcb/windows-x64 -czf fp-pcb-backend-windows-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: fp-pcb-backend-windows-x64
          path: fp-pcb-backend-windows-x64.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [select-linux-runner, linux-x64, macos, windows-x64]
    if: github.event_name == 'push' || inputs.publish_release == true
    runs-on: ${{ fromJSON(needs.select-linux-runner.outputs.runner) }}
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fp-pcb-backend-*
          path: artifacts
          merge-multiple: true
      - name: Resolve immutable release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test "$(find artifacts -name 'fp-pcb-backend-*.tar.gz' | wc -l | tr -d ' ')" = 4
          echo "tag=backend-${GITHUB_SHA:0:10}" >> "$GITHUB_OUTPUT"
      - name: Publish immutable FabRouter-enabled backend release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body: FabRouter-enabled FabPlane PCB native backends for ${{ github.sha }}.
          files: artifacts/fp-pcb-backend-*.tar.gz
          fail_on_unmatched_files: true
