<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>kicad-web renderer demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { margin: 0; height: 100%; font: 12px system-ui, sans-serif; background: #111; color: #ddd; }
      #app { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: auto 1fr auto; height: 100%; }
      #toolbar { grid-column: 1 / 3; padding: 6px 10px; background: #222; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      #layers { padding: 8px; background: #1a1a1a; overflow: auto; display: flex; flex-direction: column; gap: 4px; }
      #layers label { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
      #layers input[type=range] { width: 60px; }
      #canvas { position: relative; overflow: hidden; min-height: 200px; }
      #statusbar { grid-column: 1 / 3; padding: 4px 10px; background: #222; display: flex; gap: 20px; }
      #statusbar span:first-child { flex: 1; }
      select, button, input[type=file] { font: inherit; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <strong>@kicad-web/renderer</strong>
        <button id="fit">Zoom to fit (Home)</button>
        <button id="flip">Flip view</button>
        <label>Theme <select id="theme"><option value="default">KiCad Default</option><option value="classic">KiCad Classic</option></select></label>
        <label>User theme JSON <input id="theme-file" type="file" accept=".json" /></label>
        <label>Highlight net <select id="net"><option value="">none</option><option>GND</option><option>VCC</option></select></label>
        <label>Grid <select id="grid"><option value="mm">mm</option><option value="mil">mil</option><option value="off">off</option></select></label>
        <button id="move">Move R1 +1 mm (store diff)</button>
        <button id="remove">Remove track t3</button>
        <span id="fps"></span>
      </div>
      <div id="layers"></div>
      <div id="canvas"></div>
      <div id="statusbar"><span id="status">loading…</span><span id="cam"></span></div>
    </div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
