<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#f5f7fb"/><text x="65" y="80" font-family="sans-serif" font-size="36" fill="#192c45">Width-scaled axial proposals restore the reduced thermal control</text><text x="65" y="130" font-family="sans-serif" font-size="25" fill="#192c45">Same complete board and nine-item signal backbone; three fresh native repeats per row.</text><text x="65" y="215" font-family="sans-serif" font-size="25" fill="#192c45">Control</text><text x="650" y="215" font-family="sans-serif" font-size="25" fill="#192c45">New thermals</text><text x="930" y="215" font-family="sans-serif" font-size="25" fill="#192c45">Opens</text><text x="1130" y="215" font-family="sans-serif" font-size="25" fill="#192c45">Ownership</text><text x="1390" y="215" font-family="sans-serif" font-size="25" fill="#192c45">Accept</text><rect x="45" y="255" width="1510" height="90" rx="12" fill="#e4eaf3"/><text x="65" y="310" font-family="sans-serif" font-size="27" fill="#192c45">Original signal backbone</text><text x="650" y="310" font-family="sans-serif" font-size="27" fill="#192c45">1 / repeat</text><text x="930" y="310" font-family="sans-serif" font-size="27" fill="#192c45">109</text><text x="1130" y="310" font-family="sans-serif" font-size="27" fill="#192c45">preserved</text><text x="1390" y="310" font-family="sans-serif" font-size="27" fill="#192c45">0/3</text><rect x="45" y="365" width="1510" height="90" rx="12" fill="#daf1e7"/><text x="65" y="420" font-family="sans-serif" font-size="27" fill="#192c45">Generated 0.06096 mm ramp</text><text x="650" y="420" font-family="sans-serif" font-size="27" fill="#192c45">0 / repeat</text><text x="930" y="420" font-family="sans-serif" font-size="27" fill="#192c45">109</text><text x="1130" y="420" font-family="sans-serif" font-size="27" fill="#192c45">preserved</text><text x="1390" y="420" font-family="sans-serif" font-size="27" fill="#192c45">3/3</text><text x="65" y="545" font-family="sans-serif" font-size="27" fill="#192c45">No lost source or routed terminal pairs. Other eight generated items unchanged.</text><text x="65" y="595" font-family="sans-serif" font-size="25" fill="#192c45">Independent native save: exact copper geometry and net ownership preserved.</text><text x="65" y="665" font-family="sans-serif" font-size="25" fill="#192c45">Search extension follows the full prior prefix; stage cap remains 304 proposals.</text><text x="65" y="730" font-family="sans-serif" font-size="25" fill="#192c45">Reduced-control result only. Full Aquarius remains blocked by lost source connections.</text><text x="65" y="790" font-family="sans-serif" font-size="24" fill="#192c45">Native checks are acceptance evidence; this is not a complete-board routing score.</text></svg>