<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400"><rect width="900" height="400" fill="white"/><g font-family="sans-serif" fill="#243443"><text x="35" y="40" font-size="24">Inactive baseline findings becoming active errors</text><text x="35" y="75" font-size="17">Four controls: warning / excluded × refill on / off</text><text x="35" y="130" font-size="19">Production (three repeats)</text><rect x="35" y="150" width="800" height="65" fill="#247f61"/><text x="50" y="191" font-size="23" fill="white">4 / 4 controls pass each repeat</text><text x="35" y="260" font-size="19">Baseline active-error filter removed (sensitivity check)</text><rect x="35" y="280" width="800" height="65" fill="#b04c43"/><text x="50" y="321" font-size="23" fill="white">0 / 4 controls pass; all detect the mutation</text><text x="35" y="380" font-size="15">Stateful stand-in only. Production unchanged. No native safety gain claimed.</text></g></svg>