<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440"><rect width="1200" height="440" fill="#f7f9fc"/><g font-family="sans-serif" fill="#203047"><text x="32" y="40" font-size="24">Three terminals, one net: native connectivity control</text><text x="32" y="73" font-size="16">3 independent repeats per state; zero native errors and warnings</text><text x="32" y="140" font-size="20">Unrouted</text><circle cx="230" cy="135" r="10" fill="#d69622"/><circle cx="320" cy="135" r="10" fill="#d69622"/><circle cx="410" cy="135" r="10" fill="#d69622"/><text x="470" y="140" font-size="18">2 opens | net count: 0% | native opens: 0%</text><text x="32" y="230" font-size="20">Partial</text><path d="M 230 225 h 90" stroke="#b62c33" stroke-width="8"/><circle cx="230" cy="225" r="10" fill="#d69622"/><circle cx="320" cy="225" r="10" fill="#d69622"/><circle cx="410" cy="225" r="10" fill="#d69622"/><text x="470" y="230" font-size="18">1 opens | net count: 0% | native opens: 50%</text><text x="32" y="320" font-size="20">Complete</text><path d="M 230 315 h 90" stroke="#b62c33" stroke-width="8"/><path d="M 320 315 h 90" stroke="#b62c33" stroke-width="8"/><circle cx="230" cy="315" r="10" fill="#d69622"/><circle cx="320" cy="315" r="10" fill="#d69622"/><circle cx="410" cy="315" r="10" fill="#d69622"/><text x="470" y="320" font-size="18">0 opens | net count: 100% | native opens: 100%</text><text x="32" y="401" font-size="17">Manual segment states; production scoring unchanged; no routing gain claim.</text></g></svg>